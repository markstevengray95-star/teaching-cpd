name: Apply timetable phases 5 and 6

on:
  push:
    branches:
      - main
    paths:
      - scripts/phase56-run.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Integrate timetable phases 5 and 6
        run: python3 scripts/apply_timetable_phases5_6.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build app
        run: npm run build
      - name: Audit courses
        run: npm run audit:courses
      - name: Commit phases 5 and 6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/StaffTimetableHub.tsx
          if git diff --cached --quiet; then
            echo "No timetable integration changes to commit."
          else
            git commit -m "Complete timetable phases 5 and 6"
            git push origin main
          fi
