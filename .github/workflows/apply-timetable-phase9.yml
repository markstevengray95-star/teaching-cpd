name: Apply timetable Phase 9

on:
  push:
    branches:
      - main
    paths:
      - scripts/phase9-run.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Integrate timetable Phase 9
        run: python3 scripts/apply_timetable_phase9.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build app
        run: npm run build
      - name: Audit courses
        run: npm run audit:courses
      - name: Commit Phase 9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/StaffTimetableHub.tsx app/components/StaffTimetableAssessments.tsx
          if git diff --cached --quiet; then
            echo "No Phase 9 integration changes to commit."
          else
            git commit -m "Complete timetable Phase 9 class workspace"
            git push origin main
          fi
