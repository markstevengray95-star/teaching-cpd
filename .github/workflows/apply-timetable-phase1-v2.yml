name: Apply timetable Phase 1 v2
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run timetable Phase 1 v2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fix KS3 curriculum constructors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/components/staffTimetableCurriculumPhase1.ts')
          s = p.read_text()
          replacements = {
            'const ks3Biology = course("ks3-biology", "KS3", "National curriculum", "Biology", "KS3", [': 'const ks3Biology = course("ks3-biology", "KS3", "National curriculum", "Biology", "KS3 Biology", "KS3", [',
            'const ks3Chemistry = course("ks3-chemistry", "KS3", "National curriculum", "Chemistry", "KS3", [': 'const ks3Chemistry = course("ks3-chemistry", "KS3", "National curriculum", "Chemistry", "KS3 Chemistry", "KS3", [',
            'const ks3Physics = course("ks3-physics", "KS3", "National curriculum", "Physics", "KS3", [': 'const ks3Physics = course("ks3-physics", "KS3", "National curriculum", "Physics", "KS3 Physics", "KS3", [',
            'const ks3Science = course("ks3-science", "KS3", "National curriculum", "Science", "KS3", "KS3 Science", undefined, [] as never);': 'const ks3Science = course("ks3-science", "KS3", "National curriculum", "Science", "KS3 Science", "KS3", []);',
            'const ks3Maths = course("ks3-maths", "KS3", "National curriculum", "Maths", "KS3", [': 'const ks3Maths = course("ks3-maths", "KS3", "National curriculum", "Maths", "KS3 Mathematics", "KS3", [',
          }
          for old, new in replacements.items():
            s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Apply migration
        run: python scripts/apply_timetable_phase1.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build app
        run: npm run build
      - name: Audit courses
        run: npm run audit:courses
      - name: Commit Phase 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/StaffTimetableHub.tsx app/components/StaffTimetableHub.css app/components/staffTimetableCurriculumPhase1.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Complete Phase 1 smart curriculum profiles for staff timetable"
            git push
          fi
