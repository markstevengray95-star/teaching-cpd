name: Apply timetable phases 14 and 15

on:
  push:
    branches: [main]
    paths:
      - scripts/phase1415-run.txt

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python3 scripts/apply_timetable_phases14_15.py
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run audit:courses
      - name: Commit integrated timetable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/components/StaffTimetableHub.tsx app/components/StaffTimetableClassWorkspace.tsx lib/rolePermissions.ts
          git diff --cached --quiet || git commit -m "Complete timetable phases 14 and 15"
          git push origin main
