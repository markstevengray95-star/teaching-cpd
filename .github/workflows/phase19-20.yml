name: Validate timetable phases 19 and 20

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase19-20.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/integrate-phase19-20.py
      - run: npm ci
      - run: npm run build
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/StaffTimetableHub.tsx
          git diff --cached --quiet || git commit -m "Complete timetable phases 19 and 20"
          git push
