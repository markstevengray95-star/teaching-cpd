name: One-off whole-school migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, 'Start full Staff-development merge')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pull whole-school source
        run: git clone --depth 1 https://github.com/markstevengray95-star/Staff-development.git /tmp/staff-development

      - name: Merge Phase 31-68 features without replacing the CPD engine
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/staff-development
          copy_file() {
            local f="$1"
            mkdir -p "$(dirname "$f")"
            cp "$SRC/$f" "$f"
          }

          # Whole-school feature components. Keep the Teaching CPD-native global shell,
          # catalogue, course engine, dashboard, package.json and Supabase client.
          components=(
            app/components/AdminCentreHub.tsx
            app/components/AppraisalHub.css
            app/components/AppraisalHub.tsx
            app/components/CoachingHub.css
            app/components/CoachingHub.tsx
            app/components/CurriculumHub.css
            app/components/CurriculumHub.tsx
            app/components/DepartmentHubPanel.css
            app/components/DepartmentHubPanel.tsx
            app/components/FileStorageHub.tsx
            app/components/GoogleIntegrationsHub.tsx
            app/components/InterventionTracker.css
            app/components/InterventionTracker.tsx
            app/components/LeadershipIntelligenceHub.tsx
            app/components/NoticeCentre.css
            app/components/NoticeCentre.tsx
            app/components/NotificationsHub.tsx
            app/components/PastoralHub.css
            app/components/PastoralHub.tsx
            app/components/ProfessionalLearningHub.css
            app/components/ProfessionalLearningHub.tsx
            app/components/ProfessionalPortfolioHub.css
            app/components/ProfessionalPortfolioHub.tsx
            app/components/RegulationBehaviourHub.css
            app/components/RegulationBehaviourHub.tsx
            app/components/RemainingPhases.css
            app/components/SchoolCalendarHub.css
            app/components/SchoolCalendarHub.tsx
            app/components/SchoolIntelligenceHub.tsx
            app/components/SchoolOperationsWorkspace.tsx
            app/components/StaffDirectoryHub.tsx
            app/components/TeachingLearningHub.css
            app/components/TeachingLearningHub.tsx
            app/components/TeachingResourceGenerator.css
            app/components/TeachingResourceGenerator.tsx
          )
          for f in "${components[@]}"; do copy_file "$f"; done

          # Whole-school routes which do not replace the Teaching CPD course catalogue.
          routes=(
            app/access-denied/page.tsx
            app/admin-centre/page.tsx
            app/calendar/page.tsx
            app/curriculum/page.tsx
            app/department-analytics/page.tsx
            app/department-hub/page.tsx
            app/department-plans/page.tsx
            app/directory/page.tsx
            app/files/page.tsx
            app/forms/page.tsx
            app/integrations/page.tsx
            app/interventions/page.tsx
            app/leadership-dashboard/page.tsx
            app/notices/page.tsx
            app/notifications/page.tsx
            app/pastoral/page.tsx
            app/policies/page.tsx
            app/professional-learning/page.tsx
            app/recognition/page.tsx
            app/regulation-behaviour/page.tsx
            app/resource-generator/page.tsx
            app/resource-library/page.tsx
            app/school-assistant/page.tsx
            app/school-improvement/page.tsx
            app/search/page.tsx
            app/staff-voice/page.tsx
            app/teaching-learning/page.tsx
            app/trips/page.tsx
          )
          for f in "${routes[@]}"; do copy_file "$f"; done

          copy_file app/api/resource-generator/route.ts
          copy_file app/appraisal/page.tsx

          # Use the Phase 40/41 hubs on Teaching CPD's native direct routes.
          mkdir -p app/coaching app/portfolio app/recommendations
          cat > app/coaching/page.tsx <<'EOF'
          import CoachingHub from "../components/CoachingHub";
          export default function CoachingPage(){ return <CoachingHub />; }
          EOF
          cat > app/portfolio/page.tsx <<'EOF'
          import ProfessionalPortfolioHub from "../components/ProfessionalPortfolioHub";
          export default function PortfolioPage(){ return <ProfessionalPortfolioHub />; }
          EOF
          cat > app/recommendations/page.tsx <<'EOF'
          import SchoolIntelligenceHub from "../components/SchoolIntelligenceHub";
          export default function RecommendationsPage(){ return <SchoolIntelligenceHub mode="recommendations" />; }
          EOF

          # Keep all database migrations alongside the code. They are idempotent/live already;
          # this step gives Teaching CPD repository ownership of the schema history.
          mkdir -p supabase/migrations
          for f in "$SRC"/supabase/migrations/20261001_*.sql; do cp "$f" supabase/migrations/; done

          # The source wrapper linked to older Zones routes that are not part of Teaching CPD.
          # Replace those quick links with the newly migrated inclusion/intervention areas.
          python - <<'PY'
          from pathlib import Path
          p=Path('app/components/PastoralHub.tsx')
          s=p.read_text()
          s=s.replace('href="/regulation-room"','href="/send-eal"').replace('Regulation Room','SEND & EAL').replace('Practical regulation support','Inclusive classroom support')
          s=s.replace('href="/zones"','href="/regulation-behaviour"').replace('Zones Practice','Regulation & Behaviour').replace('Interactive regulation activities','Consistent response guidance')
          p.write_text(s)

          p=Path('app/components/RegulationBehaviourHub.tsx')
          s=p.read_text()
          start=s.find('<section className="rbQuickLinks">')
          if start!=-1:
              end=s.find('</section>', start)
              if end!=-1:
                  replacement='''<section className="rbQuickLinks">\n      <Link href="/send-eal"><span>◇</span><strong>SEND & EAL</strong><small>Inclusive classroom support</small></Link>\n      <Link href="/interventions"><span>↻</span><strong>Interventions</strong><small>Track support and review</small></Link>\n      <Link href="/pastoral"><span>◎</span><strong>Pastoral Hub</strong><small>Tutor and pastoral support</small></Link>\n      <Link href="/safeguarding"><span>✓</span><strong>Safeguarding</strong><small>Approved guidance and training</small></Link>\n    </section>'''
                  s=s[:start]+replacement+s[end+len('</section>'):]
          p.write_text(s)
          PY

          # Record that Teaching CPD is now the consolidated application.
          cat > STAFF-DEVELOPMENT-PARITY.md <<'EOF'
          # Staff Development consolidation

          Teaching CPD is now the primary repository for both the native CPD course engine and the whole-school Staff Development layer.

          ## Merged into Teaching CPD
          - Main navigation: Home, Teach, Students, Develop, School, Resources
          - Teaching & Learning Hub and resource generator
          - Department and curriculum hubs
          - Pastoral Hub
          - Regulation & Behaviour Hub
          - SEND & EAL Hub
          - Intervention tracking
          - Professional Learning Hub
          - Professional Portfolio, Coaching and Appraisal upgrades
          - Notices and School Calendar
          - Staff Directory
          - School and Department Improvement Plans
          - Forms & Approvals and Trips & Visits
          - Resource Library and Policy Centre
          - Universal Search and grounded School AI Assistant
          - Recommendations, leadership dashboard and department analytics
          - Staff recognition and Staff Voice
          - School file centre, notifications, integrations and Admin Centre
          - Supabase migration history for Phases 30-68

          The Teaching CPD catalogue/course engine remains native in this repository and is not wrapped through Staff-development.
          EOF

      - name: Install dependencies
        run: npm install

      - name: Build unified Teaching CPD
        run: npm run build

      - name: Commit migrated platform
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app lib supabase STAFF-DEVELOPMENT-PARITY.md
          if git diff --cached --quiet; then
            echo "Nothing to migrate"
            exit 0
          fi
          git commit -m "Merge Staff Development Phases 31-68 into Teaching CPD [skip migration]"
          git push origin HEAD:main
